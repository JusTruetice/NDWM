<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>A Date in the Rain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<canvas id="c" aria-label="Pixel art rainy street"></canvas>
<div id="load">loading…</div>

<div id="title" class="panel">
  <h1>A Date in the Rain</h1>
  <p>a small story, told in pixels</p>
  <button id="start" class="btn" disabled>START EXPERIENCE</button>
</div>

<div id="dlg" hidden><b id="nm"></b><span id="tx"></span><i id="nx">▼</i></div>

<div id="ask" class="panel" hidden>
  <p>Would you go on a date with me?</p>
  <div class="row"><button id="yes" class="btn">YES ❤️</button><button id="no" class="btn">NO 💀</button></div>
</div>

<div id="end" class="panel" hidden>
  <p id="endmsg"></p>
  <button id="again" class="btn">OUR STORY BEGINS ❤️</button>
</div>

<div id="hud">
  <div id="prog" title="Story progress"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <button id="mus" aria-label="Music on/off">♪ on</button>
  <button id="rn" aria-label="Rain sound on/off">☂ on</button>
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="Volume">
  <button id="skip">skip ▸▸</button>
  <button id="rs" aria-label="Restart">↺</button>
</div>

<audio id="a-music" src="./assets/music/Koe no Katachi A Silent Voice OST (Soundtrack- LIT) - Longer Version.mp3" loop preload="auto"></audio>
<audio id="a-rain" src="./assets/sounds/rain.mp3" loop preload="auto"></audio>
<audio id="a-thunder" src="./assets/sounds/thunder.mp3" preload="auto"></audio>
<audio id="a-umbrella" src="./assets/sounds/umbrella.mp3" preload="auto"></audio>
<script src="./script.js"></script>
</body>
</html>
